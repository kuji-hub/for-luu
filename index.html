<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Luu, a question 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFE1EC;
    --bg2:#FFEFD9;
    --paper:#FFF9F4;
    --dot:#F3D3DE;
    --ink:#6B2A46;
    --ink-soft:#A85F80;
    --pink:#FF4F8B;
    --pink-deep:#D62E6C;
    --butter:#FFD66B;
    --mint:#B8ECD7;
    --sky:#BFE3FF;
    --tape:rgba(255,214,107,.62);
    --tape2:rgba(184,236,215,.7);
    --shadow:rgba(214,46,108,.20);
    --heart:#FF7FAF;
    --display:"Baloo 2","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
    --hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#2B1424; --bg2:#3E1A33; --paper:#3B1E33; --dot:#4C2A44;
      --ink:#FFE7F0; --ink-soft:#E9A9C4; --pink:#FF5C96; --pink-deep:#C72A67;
      --tape:rgba(255,214,107,.38); --tape2:rgba(184,236,215,.35);
      --shadow:rgba(0,0,0,.4); --heart:#FF6FA6;
    }
  }
  :root[data-theme="dark"]{
    --bg:#2B1424; --bg2:#3E1A33; --paper:#3B1E33; --dot:#4C2A44;
    --ink:#FFE7F0; --ink-soft:#E9A9C4; --pink:#FF5C96; --pink-deep:#C72A67;
    --tape:rgba(255,214,107,.38); --tape2:rgba(184,236,215,.35);
    --shadow:rgba(0,0,0,.4); --heart:#FF6FA6;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--display);
    color:var(--ink);
    background:radial-gradient(120% 90% at 50% 0%, var(--bg2) 0%, var(--bg) 60%);
    min-height:100dvh;
    overflow:hidden;
    display:grid;
    place-items:center;
    padding:24px 16px;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- floating hearts ---------- */
  .sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .sky span{
    position:absolute;bottom:-40px;left:var(--x);
    width:var(--s);height:var(--s);
    color:var(--heart);opacity:0;
    animation:rise var(--d) linear var(--delay) infinite;
  }
  .sky span svg{width:100%;height:100%;display:block}
  @keyframes rise{
    0%{transform:translateY(0) rotate(-8deg);opacity:0}
    10%{opacity:.75}
    50%{transform:translateY(-55vh) translateX(14px) rotate(10deg)}
    100%{transform:translateY(-115vh) translateX(-10px) rotate(-6deg);opacity:0}
  }

  /* ---------- the scrapbook card ---------- */
  .scene{position:relative;width:min(100%,420px);z-index:1}
  .card{
    position:relative;z-index:2;
    background:
      radial-gradient(var(--dot) 1.4px, transparent 1.6px) 0 0/18px 18px,
      var(--paper);
    border-radius:26px;
    padding:56px 28px 36px;
    text-align:center;
    transform:rotate(-1.6deg);
    box-shadow:0 18px 40px -12px var(--shadow), 0 2px 0 rgba(255,255,255,.6) inset;
    animation:stick .7s cubic-bezier(.2,1.4,.4,1) both;
  }
  @keyframes stick{
    from{transform:rotate(-6deg) scale(1.12);opacity:0}
    to{transform:rotate(-1.6deg) scale(1);opacity:1}
  }
  /* washi tape */
  .card::before,.card::after{
    content:"";position:absolute;width:118px;height:30px;
    background:repeating-linear-gradient(135deg,var(--tape) 0 8px,transparent 8px 14px),var(--tape);
    opacity:.95;pointer-events:none;
  }
  .card::before{top:-12px;left:-26px;transform:rotate(-10deg)}
  .card::after{bottom:-12px;right:-24px;transform:rotate(7deg);
    background:repeating-linear-gradient(135deg,var(--tape2) 0 8px,transparent 8px 14px),var(--tape2)}

  .tag{
    display:inline-block;font-family:var(--hand);font-weight:700;
    font-size:1.35rem;color:var(--ink-soft);
    transform:rotate(-3deg);margin-bottom:6px;
  }
  h1{
    font-weight:800;font-size:clamp(1.9rem,7.2vw,2.5rem);line-height:1.08;
    letter-spacing:-.01em;margin:4px 0 8px;
  }
  .note{
    font-family:var(--hand);font-weight:600;font-size:1.3rem;
    color:var(--ink-soft);margin-bottom:26px;transform:rotate(1deg);
  }

  .choices{
    display:flex;justify-content:center;align-items:center;gap:18px;
    min-height:64px;flex-wrap:wrap;
  }
  .btn{
    font-family:var(--display);font-weight:800;border:0;cursor:pointer;
    border-radius:999px;line-height:1;touch-action:none;user-select:none;
    -webkit-user-select:none;
  }
  .btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
  #yes{
    --grow:1;
    font-size:1.35rem;color:#fff;background:var(--pink);
    padding:16px 30px;
    box-shadow:0 6px 0 var(--pink-deep),0 14px 24px -10px var(--shadow);
    transform:scale(var(--grow));
    transition:transform .35s cubic-bezier(.2,1.6,.4,1);
    transform-origin:center;
  }
  #yes:active{transform:scale(var(--grow)) translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
  #no{
    --shrink:1;--tilt:0deg;
    font-size:1.05rem;color:var(--ink-soft);background:transparent;
    border:2.5px dashed var(--ink-soft);padding:13px 22px;
    transform:scale(var(--shrink)) rotate(var(--tilt));
    transition:left .45s cubic-bezier(.2,1.4,.4,1),top .45s cubic-bezier(.2,1.4,.4,1),transform .3s;
    white-space:nowrap;
  }
  #no.loose{position:fixed;z-index:50;margin:0;background:var(--paper)}

  /* ---------- stickers ---------- */
  .sticker{
    position:absolute;z-index:3;pointer-events:none;
    filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff)
           drop-shadow(0 6px 8px rgba(107,42,70,.22));
    animation:pop .55s cubic-bezier(.2,1.6,.4,1) both;
  }
  .sticker svg{display:block;width:100%;height:100%;overflow:visible}
  @keyframes pop{from{transform:scale(0) rotate(var(--r,0deg));opacity:0}to{transform:scale(1) rotate(var(--r,0deg));opacity:1}}

  .cat{width:118px;height:110px;left:50%;top:-64px;margin-left:-59px;z-index:1;--r:-3deg;animation-delay:.25s}
  .berry{width:74px;height:78px;left:-20px;bottom:-24px;--r:-14deg;animation-delay:.45s}
  .cloud{width:92px;height:62px;right:-30px;top:19%;--r:9deg;animation-delay:.55s}
  .star{width:58px;height:58px;right:20px;top:-18px;--r:16deg;animation-delay:.65s}
  .boba{width:62px;height:82px;right:-16px;bottom:-26px;--r:11deg;animation-delay:.75s}
  .mail{width:78px;height:60px;left:-28px;top:38%;--r:-11deg;animation-delay:.85s}
  .cat-happy{width:126px;height:110px;left:50%;top:-70px;margin-left:-63px;z-index:1;--r:2deg}

  /* ---------- celebration ---------- */
  .yay{display:none}
  .scene.said-yes .ask,.scene.said-yes .cat{display:none}
  .scene.said-yes .yay{display:block}
  .scene.said-yes .card{animation:bounce .8s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes bounce{0%{transform:rotate(-1.6deg) scale(.9)}60%{transform:rotate(1.4deg) scale(1.06)}100%{transform:rotate(-1.6deg) scale(1)}}
  .yay h1{font-size:clamp(2.2rem,9vw,3rem);margin-top:6px}
  .yay p{font-size:1.15rem;line-height:1.35;margin:8px 0}
  .yay .ps{font-family:var(--hand);font-size:1.35rem;color:var(--ink-soft);margin-top:18px}
  .yay .count{font-family:var(--hand);font-size:1.15rem;color:var(--ink-soft);opacity:.85}
  .yay .sig{font-family:var(--hand);font-size:1.45rem;margin-top:14px}

  .burst{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px;pointer-events:none;z-index:60;color:var(--heart)}
  .burst svg{width:100%;height:100%;display:block}

  @media (prefers-reduced-motion: reduce){
    .card,.sticker,.scene.said-yes .card{animation:none}
    .sky span{animation:none;opacity:.35;bottom:auto;top:var(--y)}
    #no{transition:none}
  }
  @media (max-width:380px){
    .card{padding:52px 20px 32px}
    .berry{left:-10px}.mail{left:-16px}.cloud{right:-18px}.boba{right:-8px}
  }
</style>
</head>

  <div class="card">

    <div class="ask">

      <h1><span class="name">Luu</span>, do you wanna be my girlfriend?</h1>

<script>
(function(){
  // ---------- change her name here ----------
  const NAME = 'Luu';
  document.querySelectorAll('.name').forEach(n => n.textContent = NAME);
  document.title = NAME + ', a question 💌';

  const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="currentColor"/></svg>';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // floating hearts
  const sky = document.getElementById('sky');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.innerHTML = HEART;
    s.style.setProperty('--x', Math.random()*100 + 'vw');
    s.style.setProperty('--y', Math.random()*100 + 'vh');
    s.style.setProperty('--s', (12 + Math.random()*22) + 'px');
    s.style.setProperty('--d', (9 + Math.random()*9) + 's');
    s.style.setProperty('--delay', (-Math.random()*16) + 's');
    sky.appendChild(s);
  }

  // ---------- the runaway "no" ----------
  const scene = document.getElementById('scene');
  const yes = document.getElementById('yes');
  const no  = document.getElementById('no');
  const lines = [
    'no', 'wait what', 'are you sure?', 'really really sure?',
    'think about it…', 'nope, try again', 'pretty please 🥺',
    "i'll buy you boba", 'wrong button bestie', 'my thumb is faster',
    'ok now you\'re just being mean', 'the button is tired',
    'this is embarrassing for both of us', 'i can do this all day',
    'you know you want to', 'the other one is HUGE now',
    'just tap yes already 😭', 'Luu. please.'
  ];
  let attempts = 0, last = 0;

  function overlaps(a, b){
    return !(a.x + a.w < b.left || a.x > b.right || a.y + a.h < b.top || a.y > b.bottom);
  }

  function flee(e){
    if (e && e.cancelable) e.preventDefault();
    const now = Date.now();
    if (now - last < 160) return;   // one hop per gesture
    last = now;
    attempts++;

    if (!no.classList.contains('loose')) {
      const r = no.getBoundingClientRect();
      document.body.appendChild(no);  // out of the rotated card, so "fixed" means the real screen
      no.style.left = r.left + 'px';
      no.style.top  = r.top + 'px';
      no.classList.add('loose');
      void no.offsetWidth;            // commit position before the hop
    }

    const pad = 14, W = innerWidth, H = innerHeight;
    const bw = no.offsetWidth, bh = no.offsetHeight;
    const yr = yes.getBoundingClientRect();
    const safe = { left: yr.left - 50, right: yr.right + 50, top: yr.top - 50, bottom: yr.bottom + 50 };
    const cur = no.getBoundingClientRect();
    let x, y, tries = 0;
    do {
      x = pad + Math.random() * Math.max(1, W - bw - pad*2);
      y = pad + Math.random() * Math.max(1, H - bh - pad*2);
      tries++;
    } while (tries < 30 && (overlaps({x,y,w:bw,h:bh}, safe) || Math.hypot(x - cur.left, y - cur.top) < 140));

    no.style.left = x + 'px';
    no.style.top  = y + 'px';
    no.style.setProperty('--tilt', (Math.random()*28 - 14).toFixed(1) + 'deg');
    no.style.setProperty('--shrink', Math.max(0.68, 1 - attempts*0.035).toFixed(3));
    no.textContent = lines[Math.min(attempts, lines.length - 1)];
    yes.style.setProperty('--grow', Math.min(2.15, 1 + attempts*0.11).toFixed(3));
  }

  no.addEventListener('mouseenter', flee);
  no.addEventListener('pointerdown', flee);
  no.addEventListener('touchstart', flee, {passive:false});
  no.addEventListener('click', flee);
  no.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') flee(e); });

  // desktop: dodge before the cursor even arrives
  addEventListener('mousemove', e => {
    if (!no.isConnected || matchMedia('(hover: none)').matches) return;
    const r = no.getBoundingClientRect();
    const cx = Math.max(r.left, Math.min(e.clientX, r.right));
    const cy = Math.max(r.top,  Math.min(e.clientY, r.bottom));
    if (Math.hypot(e.clientX - cx, e.clientY - cy) < 48) flee();
  }, {passive:true});

  // keep it on screen if she rotates the phone
  addEventListener('resize', () => {
    if (!no.classList.contains('loose')) return;
    const r = no.getBoundingClientRect();
    if (r.right > innerWidth || r.bottom > innerHeight) flee();
  });

  // ---------- yes ----------
  function burst(){
    if (reduce) return;
    const n = 70;
    for (let i = 0; i < n; i++) {
      const h = document.createElement('div');
      h.className = 'burst';
      h.innerHTML = HEART;
      const size = 14 + Math.random()*22;
      h.style.width = h.style.height = size + 'px';
      h.style.margin = -size/2 + 'px';
      h.style.color = ['#FF4F8B','#FF7FAF','#FFD66B','#B8ECD7','#BFE3FF','#FF5C7A'][i % 6];
      document.body.appendChild(h);
      const ang = Math.random()*Math.PI*2;
      const dist = 140 + Math.random()*Math.min(innerWidth, innerHeight)*0.55;
      const dx = Math.cos(ang)*dist, dy = Math.sin(ang)*dist - 80;
      h.animate([
        { transform:'translate(0,0) scale(.3) rotate(0deg)', opacity:1 },
        { transform:`translate(${dx*0.7}px,${dy*0.7}px) scale(1.15) rotate(${Math.random()*300-150}deg)`, opacity:1, offset:.55 },
        { transform:`translate(${dx}px,${dy+220}px) scale(.9) rotate(${Math.random()*500-250}deg)`, opacity:0 }
      ], { duration: 1500 + Math.random()*900, easing:'cubic-bezier(.15,.8,.3,1)', fill:'forwards' })
      .onfinish = () => h.remove();
    }
  }

  yes.addEventListener('click', () => {
    no.remove();
    const c = document.getElementById('count');
    c.textContent = attempts > 0
      ? `(you tried to say no ${attempts} time${attempts === 1 ? '' : 's'}… i saw that 👀)`
      : '(no hesitation. i love that for us.)';
    scene.classList.add('said-yes');
    document.title = NAME + ' said yes 💖';
    burst();
    setTimeout(burst, 500);
  });
})();
</script>
</body>
</html>
